<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="起点 — 个人浏览器主页">
  <title>起点 · 个人主页</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20.4 14A8.5 8.5 0 0 1 10 3.6 8.5 8.5 0 1 0 20.4 14Z"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--bg)"/><circle cx="15" cy="17" r="2.5" fill="var(--bg)"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </svg>
  <header class="header">
    <div class="brand"><svg class="brand-mark icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v7m0 12v7M3 16h7m12 0h7"/><circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg><span>起点</span></div>
    <div class="header-actions"><span class="date-mini"></span><button class="icon-button" id="theme-toggle" aria-label="切换深色外观" title="切换外观"><svg class="icon"><use href="#moon"/></svg></button><button class="icon-button" data-open-settings aria-label="外观设置" title="外观设置"><svg class="icon"><use href="#settings"/></svg></button></div>
  </header>
  <main>
    <section aria-label="时间和日期"><div class="date">今天 · 起点</div><h1 class="clock" aria-label="当前时间">--:--</h1><p class="greeting"><svg class="icon" aria-hidden="true"><use href="#sun"/></svg><span id="greeting-text">开启今天的好奇心</span></p></section>
    <div class="search-wrap">
      <form class="search" role="search" aria-label="网页搜索">
        <button type="button" class="engine" id="engine-toggle" aria-label="选择搜索引擎，当前 Google" aria-haspopup="true" aria-expanded="false"><span class="engine-letter">G</span><svg class="icon" aria-hidden="true"><use href="#chevron"/></svg></button>
        <input id="search-input" aria-label="搜索内容或网址" autocomplete="off" placeholder="搜索一下，或者输入网址">
        <kbd class="keycap" title="按斜杠键聚焦搜索">/</kbd>
        <button class="search-button" type="submit" aria-label="搜索"><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button>
      </form>
      <div class="engine-menu" id="engine-menu" hidden><button class="engine-choice" data-engine="Google" data-letter="G" data-color="#4285f4"><strong style="color:#4285f4">G</strong>Google<small>默认</small></button><button class="engine-choice" data-engine="Bing" data-letter="b" data-color="#48a5a5"><strong style="color:#48a5a5">b</strong>Bing</button><button class="engine-choice" data-engine="百度" data-letter="度" data-color="#587fe0"><strong style="color:#587fe0">度</strong>百度</button></div>
    </div>
    <p class="search-note">用 <span id="engine-name">Google</span> 探索更多</p>
    <nav class="shortcuts" aria-label="常用网站">
      <a class="shortcut" href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon google">G</span><span class="shortcut-label">Google</span></a>
      <a class="shortcut" href="https://www.bilibili.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon bilibili"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="m8 3 3 4m6-4-3 4M8 12v3m8-3v3m-6 2h4"/></svg></span><span class="shortcut-label">哔哩哔哩</span></a>
      <a class="shortcut" href="https://github.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon github"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.1.68-.21.68-.48v-1.87c-2.78.61-3.37-1.18-3.37-1.18-.45-1.15-1.11-1.45-1.11-1.45-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.64-1.33-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.5 9.5 0 0 1 12 6.84c.85 0 1.71.11 2.5.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.73c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg></span><span class="shortcut-label">GitHub</span></a>
      <a class="shortcut" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon ai"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5L12 2Z"/><path d="m20 17 .8 2.2L23 20l-2.2.8L20 23l-.8-2.2L17 20l2.2-.8L20 17Z"/></svg></span><span class="shortcut-label">ChatGPT</span></a>
      <a class="shortcut" href="https://www.notion.so/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon notion">N</span><span class="shortcut-label">Notion</span></a>
      <button class="shortcut add" type="button" aria-label="添加快捷方式"><span class="shortcut-icon"><svg class="icon" aria-hidden="true"><use href="#plus"/></svg></span><span class="shortcut-label">添加快捷方式</span></button>
    </nav>
  </main>
  <footer><span class="footer-note"><span class="small-dot"></span>留一点空白，给新的灵感</span><button class="customize" data-open-settings><svg class="icon" aria-hidden="true"><use href="#settings"/></svg>自定义页面</button></footer>
  <dialog id="appearance"><div class="dialog-top"><h2>你的起点</h2><button class="icon-button" id="close-settings" aria-label="关闭外观设置"><svg class="icon"><use href="#close"/></svg></button></div><p class="dialog-desc">选一种让你舒服的颜色。</p><p class="field-label">页面外观</p><div class="theme-grid"><button class="theme" data-theme-choice="light" aria-pressed="true"><div class="swatch swatch-light"></div>晨雾</button><button class="theme" data-theme-choice="paper" aria-pressed="false"><div class="swatch swatch-paper"></div>暖纸</button><button class="theme" data-theme-choice="dark" aria-pressed="false"><div class="swatch swatch-dark"></div>夜色</button></div><button class="done" id="done-settings">就用这个</button></dialog>
    <dialog id="shortcut-dialog">
    <div class="dialog-top"><h2 id="shortcut-title">添加快捷方式</h2><button type="button" class="icon-button" id="close-shortcut" aria-label="关闭快捷方式设置"><svg class="icon"><use href="#close"/></svg></button></div>
    <p class="dialog-desc">把常用的网站，放在眼前。</p>
    <form id="shortcut-form">
      <label class="form-label" for="shortcut-name">名称</label><input class="form-input" id="shortcut-name" name="name" maxlength="32" placeholder="例如：知乎" autocomplete="off" required>
      <label class="form-label" for="shortcut-url">网址</label><input class="form-input" id="shortcut-url" name="url" maxlength="2048" placeholder="https://example.com" inputmode="url" autocomplete="url" spellcheck="false" required>
      <p class="form-error" id="shortcut-error" role="alert" hidden></p>
      <div class="shortcut-actions"><button type="button" class="delete-button" id="delete-shortcut" hidden>删除</button><button class="done" type="submit">保存</button></div>
    </form>
  </dialog>
  <div class="status-message" id="status-message" role="status" aria-live="polite"></div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
