<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="起点 — 个人浏览器主页视觉设计稿">
  <title>起点 · 主页设计</title>
  <style>
    :root { --bg:#f8faf9; --text:#263a35; --muted:#8b9692; --surface:#ffffff; --line:#e3e9e6; --accent:#688a79; --soft:#edf2ef; --hover:#eff4f1; --shadow:0 3px 8px #203c2d04,0 12px 36px #203c2d04; }
    [data-theme="dark"] { --bg:#19211f; --text:#e6ece8; --muted:#8c9d94; --surface:#222d28; --line:#344139; --accent:#a4c4af; --soft:#28352e; --hover:#27362e; --shadow:0 10px 36px #00000012; }
    [data-theme="paper"] { --bg:#f5f1e9; --text:#4b4539; --muted:#9c9484; --surface:#fffdf8; --line:#e6dfd2; --accent:#998567; --soft:#ece6db; --hover:#eee8dd; --shadow:0 8px 32px #56422406; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:var(--bg); color:var(--text); font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; transition:background .25s,color .25s; }
    button,input,a { -webkit-tap-highlight-color:transparent; }
    button,input { font:inherit; }
    button,a { touch-action:manipulation; }
    button { color:inherit; cursor:pointer; }
    button:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:5px; }
    button { border:0; }
    svg { display:block; width:20px; height:20px; }
    .icon { fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
    .header { height:100px; padding:32px 42px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:11px; font-size:17px; font-weight:600; letter-spacing:2px; }
    .brand-mark { width:28px; height:28px; color:var(--accent); }
    .header-actions { display:flex; align-items:center; gap:14px; }
    .date-mini { color:var(--muted); font-size:11px; font-weight:500; letter-spacing:1.7px; margin-right:7px; }
    .icon-button { display:grid; place-items:center; width:38px; height:38px; border-radius:50%; background:transparent; color:var(--muted); transition:background .15s,color .15s; }
    .icon-button:hover { background:var(--soft); color:var(--text); }
    main { width:min(100% - 40px,720px); margin:78px auto 100px; text-align:center; }
    .date { font-size:13px; color:var(--muted); letter-spacing:1.5px; }
    .clock { font-size:104px; font-weight:300; line-height:1.18; letter-spacing:-5px; font-variant-numeric:tabular-nums; margin:9px 0 0; }
    .greeting { display:flex; align-items:center; justify-content:center; gap:7px; font-size:13px; color:var(--accent); letter-spacing:1px; margin:11px 0 43px; }
    .greeting svg { width:15px; height:15px; }
    .search-wrap { position:relative; width:100%; }
    .search { width:100%; height:64px; border:1px solid var(--line); border-radius:32px; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; padding:7px 10px 7px 18px; text-align:left; transition:box-shadow .2s,border-color .2s; }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent),var(--shadow); }
    .engine { display:flex; align-items:center; gap:10px; height:36px; background:transparent; padding:4px 14px 4px 6px; border-right:1px solid var(--line); border-radius:0; }
    .engine-letter { font:600 22px/1 "Segoe UI",sans-serif; color:#4285f4; min-width:20px; text-align:center; }
    .engine svg { width:11px; height:11px; color:var(--muted); stroke-width:2; }
    .search input { flex:1; width:0; min-width:0; border:0; outline:none; color:var(--text); background:transparent; padding:0 18px; font-size:15px; height:46px; }
    .search input::placeholder { color:#a0aaa5; }
    .keycap { font:11px/1 "Segoe UI",sans-serif; color:var(--muted); padding:5px 7px; border:1px solid var(--line); border-radius:5px; margin-right:12px; }
    .search-button { display:grid; place-items:center; height:42px; width:42px; flex-shrink:0; border-radius:50%; background:var(--soft); color:var(--accent); }
    .search-button:hover { background:var(--line); }
    .search-note { margin:14px 0 0; color:var(--muted); font-size:11px; letter-spacing:.4px; }
    .search-note span { color:var(--accent); }
    .engine-menu { position:absolute; top:74px; left:0; z-index:4; width:186px; padding:6px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); border-radius:16px; text-align:left; }
    .engine-menu[hidden] { display:none; }
    .engine-choice { display:flex; align-items:center; gap:12px; width:100%; background:transparent; padding:12px; border-radius:10px; font-size:13px; }
    .engine-choice:hover { background:var(--hover); }
    .engine-choice strong { width:18px; font-size:17px; }
    .engine-choice small { margin-left:auto; color:var(--accent); font-size:10px; }
    .shortcuts { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; width:min(100%,650px); margin:44px auto 0; }
    .shortcut { position:relative; min-width:0; border-radius:18px; padding:16px 4px 13px; color:var(--text); text-decoration:none; background:transparent; transition:background .18s,transform .18s; }
    .shortcut:hover { background:var(--hover); transform:translateY(-2px); }
    .shortcut-icon { display:grid; place-items:center; width:50px; height:50px; margin:0 auto 13px; border:1px solid color-mix(in srgb,var(--line) 70%,transparent); border-radius:18px; background:var(--soft); }
    .shortcut-icon svg { width:23px; height:23px; }
    .shortcut-label { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .google { font-size:25px; color:#4285f4; font-weight:600; }
    .bilibili { color:#78aabd; }
    .github { color:var(--text); }
    .ai { color:#719b87; }
    .notion { font:600 25px Georgia,serif; color:var(--text); }
    .add .shortcut-icon { background:transparent; border:1px dashed color-mix(in srgb,var(--muted) 45%,transparent); color:var(--muted); }
    .add .shortcut-label { color:var(--muted); }
    footer { position:fixed; bottom:27px; left:42px; right:35px; display:flex; align-items:center; justify-content:space-between; }
    .footer-note { display:flex; align-items:center; gap:8px; font-size:10px; color:var(--muted); letter-spacing:1.1px; }
    .small-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.65; }
    .customize { background:transparent; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:22px; padding:11px 16px; transition:background .15s; }
    .customize:hover { background:var(--surface); }
    .customize svg { width:14px; height:14px; }
    dialog { width:340px; max-width:calc(100% - 32px); border:1px solid var(--line); border-radius:24px; padding:25px; background:var(--surface); color:var(--text); box-shadow:0 24px 80px #0002; }
    dialog::backdrop { background:#18251d20; backdrop-filter:blur(5px); }
    .dialog-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .dialog-top h2 { font-size:19px; font-weight:500; margin:0; }
    .dialog-desc { color:var(--muted); font-size:12px; margin:0 0 25px; }
    .field-label { font-size:12px; margin:0 0 12px; }
    .theme-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .theme { background:transparent; border:1px solid var(--line); padding:6px 6px 10px; border-radius:13px; font-size:11px; color:var(--muted); }
    .theme[aria-pressed="true"] { border-color:var(--accent); color:var(--text); }
    .swatch { height:58px; border-radius:8px; margin-bottom:10px; display:grid; place-items:center; }
    .swatch::after { content:""; height:5px; width:38px; border-radius:9px; background:currentColor; opacity:.3; box-shadow:0 -9px 0 -1px currentColor; }
    .swatch-light { background:#f0f5f1; color:#668b77; }
    .swatch-paper { background:#f2ece0; color:#9b8666; }
    .swatch-dark { background:#202b25; color:#aec8b5; }
    .done { width:100%; padding:12px; border-radius:12px; margin-top:25px; background:var(--soft); color:var(--accent); font-size:13px; }
    @media (min-height:1000px) { main { margin-top:calc(18vh - 85px); } }
    @media (max-width:640px) {
      .header { height:84px; padding:22px 24px; } .date-mini { display:none; } .brand { font-size:16px; }
      main { width:calc(100% - 36px); margin-top:76px; } .clock { font-size:82px; letter-spacing:-4px; } .date { font-size:12px; }
      .greeting { margin-bottom:36px; } .search { height:60px; padding-left:11px; } .search input { font-size:13px; padding:0 12px; }
      .engine { padding-right:10px; gap:6px; } .keycap { display:none; } .search-button { width:38px; height:38px; }
      .shortcuts { grid-template-columns:repeat(3,1fr); width:min(100%,350px); gap:7px 12px; margin-top:30px; }
      .shortcut { padding:15px 5px; } .shortcut-icon { margin-bottom:11px; } footer { left:24px; right:22px; bottom:22px; }
      .footer-note { font-size:9px; letter-spacing:.5px; } .customize { padding:10px 13px; font-size:11px; }
    }
    @media (max-height:720px) and (min-width:641px) { main { margin-top:20px; } .clock { font-size:86px; } .greeting { margin-bottom:25px; } .shortcuts { margin-top:25px; } }
    @media (max-height:760px) and (max-width:640px) { main { margin-top:30px; } footer { position:static; margin:40px 22px 22px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20.4 14A8.5 8.5 0 0 1 10 3.6 8.5 8.5 0 1 0 20.4 14Z"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--bg)"/><circle cx="15" cy="17" r="2.5" fill="var(--bg)"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </svg>
  <header class="header">
    <div class="brand"><svg class="brand-mark icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v7m0 12v7M3 16h7m12 0h7"/><circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg><span>起点</span></div>
    <div class="header-actions"><span class="date-mini">SUNDAY, OCT 11</span><button class="icon-button" id="theme-toggle" aria-label="切换深色外观" title="切换外观"><svg class="icon"><use href="#moon"/></svg></button><button class="icon-button" data-open-settings aria-label="外观设置" title="外观设置"><svg class="icon"><use href="#settings"/></svg></button></div>
  </header>
  <main>
    <section aria-label="时间和日期"><div class="date">2026 年 10 月 11 日 · 星期日</div><h1 class="clock" aria-label="10点08分">10:08</h1><p class="greeting"><svg class="icon" aria-hidden="true"><use href="#sun"/></svg>上午好，开启今天的好奇心</p></section>
    <div class="search-wrap">
      <form class="search" role="search" aria-label="网页搜索">
        <button type="button" class="engine" id="engine-toggle" aria-label="选择搜索引擎，当前 Google" aria-haspopup="true" aria-expanded="false"><span class="engine-letter">G</span><svg class="icon" aria-hidden="true"><use href="#chevron"/></svg></button>
        <input id="search-input" aria-label="搜索内容或网址" autocomplete="off" placeholder="搜索一下，或者输入网址">
        <kbd class="keycap" title="按斜杠键聚焦搜索">/</kbd>
        <button class="search-button" type="submit" aria-label="搜索"><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button>
      </form>
      <div class="engine-menu" id="engine-menu" hidden><button class="engine-choice" data-engine="Google" data-letter="G" data-color="#4285f4"><strong style="color:#4285f4">G</strong>Google<small>默认</small></button><button class="engine-choice" data-engine="Bing" data-letter="b" data-color="#48a5a5"><strong style="color:#48a5a5">b</strong>Bing</button><button class="engine-choice" data-engine="百度" data-letter="度" data-color="#587fe0"><strong style="color:#587fe0">度</strong>百度</button></div>
    </div>
    <p class="search-note">用 <span id="engine-name">Google</span> 探索更多</p>
    <nav class="shortcuts" aria-label="常用网站">
      <a class="shortcut" href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon google">G</span><span class="shortcut-label">Google</span></a>
      <a class="shortcut" href="https://www.bilibili.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon bilibili"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="m8 3 3 4m6-4-3 4M8 12v3m8-3v3m-6 2h4"/></svg></span><span class="shortcut-label">哔哩哔哩</span></a>
      <a class="shortcut" href="https://github.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon github"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.1.68-.21.68-.48v-1.87c-2.78.61-3.37-1.18-3.37-1.18-.45-1.15-1.11-1.45-1.11-1.45-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.64-1.33-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.5 9.5 0 0 1 12 6.84c.85 0 1.71.11 2.5.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.73c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg></span><span class="shortcut-label">GitHub</span></a>
      <a class="shortcut" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon ai"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5L12 2Z"/><path d="m20 17 .8 2.2L23 20l-2.2.8L20 23l-.8-2.2L17 20l2.2-.8L20 17Z"/></svg></span><span class="shortcut-label">ChatGPT</span></a>
      <a class="shortcut" href="https://www.notion.so/" target="_blank" rel="noopener noreferrer"><span class="shortcut-icon notion">N</span><span class="shortcut-label">Notion</span></a>
      <button class="shortcut add" type="button" aria-label="添加快捷方式"><span class="shortcut-icon"><svg class="icon" aria-hidden="true"><use href="#plus"/></svg></span><span class="shortcut-label">添加快捷方式</span></button>
    </nav>
  </main>
  <footer><span class="footer-note"><span class="small-dot"></span>留一点空白，给新的灵感</span><button class="customize" data-open-settings><svg class="icon" aria-hidden="true"><use href="#settings"/></svg>自定义页面</button></footer>
  <dialog id="appearance"><div class="dialog-top"><h2>你的起点</h2><button class="icon-button" id="close-settings" aria-label="关闭外观设置"><svg class="icon"><use href="#close"/></svg></button></div><p class="dialog-desc">选一种让你舒服的颜色。</p><p class="field-label">页面外观</p><div class="theme-grid"><button class="theme" data-theme-choice="light" aria-pressed="true"><div class="swatch swatch-light"></div>晨雾</button><button class="theme" data-theme-choice="paper" aria-pressed="false"><div class="swatch swatch-paper"></div>暖纸</button><button class="theme" data-theme-choice="dark" aria-pressed="false"><div class="swatch swatch-dark"></div>夜色</button></div><button class="done" id="done-settings">就用这个</button></dialog>
  <script>
    // 视觉稿：时间为固定示例；搜索提交与快捷方式管理留待正式实现。
    const root = document.documentElement;
    const appearance = document.getElementById('appearance');
    const engineToggle = document.getElementById('engine-toggle');
    const engineMenu = document.getElementById('engine-menu');
    const searchInput = document.getElementById('search-input');
    function applyTheme(theme) {
      root.dataset.theme = theme;
      document.querySelectorAll('[data-theme-choice]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === theme)));
      const dark = theme === 'dark';
      document.querySelector('#theme-toggle use').setAttribute('href', dark ? '#sun' : '#moon');
      document.getElementById('theme-toggle').setAttribute('aria-label', dark ? '切换浅色外观' : '切换深色外观');
    }
    document.getElementById('theme-toggle').addEventListener('click', () => applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
    document.querySelectorAll('[data-open-settings]').forEach(button => button.addEventListener('click', () => appearance.showModal()));
    document.querySelectorAll('[data-theme-choice]').forEach(button => button.addEventListener('click', () => applyTheme(button.dataset.themeChoice)));
    document.getElementById('close-settings').addEventListener('click', () => appearance.close());
    document.getElementById('done-settings').addEventListener('click', () => appearance.close());
    appearance.addEventListener('click', event => { if(event.target === appearance) { const bounds = appearance.getBoundingClientRect(); if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) appearance.close(); } });
    function closeEngineMenu() { engineMenu.hidden = true; engineToggle.setAttribute('aria-expanded','false'); }
    engineToggle.addEventListener('click', () => { engineMenu.hidden = !engineMenu.hidden; engineToggle.setAttribute('aria-expanded',String(!engineMenu.hidden)); });
    document.querySelectorAll('[data-engine]').forEach(button => button.addEventListener('click', () => { document.getElementById('engine-name').textContent = button.dataset.engine; const letter = document.querySelector('.engine-letter'); letter.textContent = button.dataset.letter; letter.style.color = button.dataset.color; engineToggle.setAttribute('aria-label','选择搜索引擎，当前 ' + button.dataset.engine); closeEngineMenu(); searchInput.focus(); }));
    document.addEventListener('click', event => { if (!event.target.closest('.search-wrap')) closeEngineMenu(); });
    document.addEventListener('keydown', event => { if(event.key === 'Escape') closeEngineMenu(); if(event.key === '/' && !appearance.open && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { event.preventDefault(); searchInput.focus(); } });
    document.querySelector('.search').addEventListener('submit', event => event.preventDefault());
  </script>
</body>
</html>
